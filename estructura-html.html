<!DOCTYPE html>
<html>

<head>
    <title>Primera estructura web</title>
</head>

<body>
    <h1>Esta rama es evidencia de aprendizaje sobre html</h1>
    <p>No es un index.html porque no será montado, solo es práctica</p>
    <p>Actualizacion <span style="color:blue">de texto</span>, esto es largo aaaaaa<br>aaaaaaaaaaaaaaaaaaaaaaaaaa</p>
    <!--
        la etiqueta <span></span> permite que una parte específica del
        código pueda ser modificado sin alterar lo demás. Style es un valor de css. <br> permite el salto de linea
    -->
    <a target="_blank" href="https://www.youtube.com/">Ir a youtube<br></a>
    <!--
        href es la propiedad de poner un link con la forma dentro del etiquetado
        <a>(forma en txt)</a> y target="_blank" es para que habra una página extra de la cual
        abrirá el vinculado
    -->
    <p>Imagen con dimensiones iguales<br></p>
    <img src="six_seven.jpg" height="400" /><br>
    <!--puede ser height o width-->
    <p>Imagen con diferentes dimensiones<br></p>
    <img src="six_seven.jpg" height="200" width="300" />
    <!--nuevas etiquetas para interactuar con el usuario-->
    <form action="/formulario" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="Nombre" placeholder="Arnold...." /><br>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="Apellido" placeholder="Ponce...." /><br>
        <label for="comentario">Comentario</label><br>
        <textarea cols="40" rows="10" id="comentario" placeholder="Nuevas etiquetas..."></textarea> <br>
        <input type="submit">
        <br>
    </form>
</body>

</html>
